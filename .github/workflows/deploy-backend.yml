name: Deploy Backend (FastAPI → Cloud Run)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: myfitness-backend
  DOCKERHUB_IMAGE: deepshah995/myfitness-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'deepshah995' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          REGION="${{ secrets.GCP_REGION }}"
          if [ -z "$REGION" ]; then REGION="us-central1"; fi
          FRONTEND_ORIGIN="${{ secrets.FRONTEND_ORIGIN }}"
          if [ -z "$FRONTEND_ORIGIN" ]; then FRONTEND_ORIGIN="http://localhost:5173"; fi
          echo "Deploying backend to region: $REGION"
          gcloud config set run/region "$REGION"

          CMD=(
            gcloud run deploy "${{ env.IMAGE_NAME }}"
            --project "${{ secrets.GCP_PROJECT_ID }}"
            --image "${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
            --region "$REGION"
            --platform managed
            --allow-unauthenticated
            --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},OPENAI_MODEL=gpt-4o-mini,SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }},FRONTEND_ORIGIN=$FRONTEND_ORIGIN,GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}"
          )

          "${CMD[@]}"

