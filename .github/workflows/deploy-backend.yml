name: Deploy Backend (FastAPI → Cloud Run)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: myfitness-backend
  DOCKERHUB_IMAGE: deepshah995/myfitness-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: deepshah995
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.IMAGE_NAME }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "50801762919-compute@developer.gserviceaccount.com" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }},FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}"

