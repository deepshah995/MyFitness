name: Deploy Frontend (React → Cloud Run)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: myfitness-frontend
  DOCKERHUB_IMAGE: deepshah995/myfitness-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'deepshah995' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          if [ -z "$REGION" ]; then REGION="us-central1"; fi
          API_BASE_URL="${{ secrets.BACKEND_API_URL }}"
          if [ -z "$API_BASE_URL" ]; then API_BASE_URL="http://localhost:8080"; fi

          gcloud run deploy "${{ env.IMAGE_NAME }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --image "${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "API_BASE_URL=$API_BASE_URL"

